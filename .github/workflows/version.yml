name: Version Management

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version type (major, minor, patch)'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  bump-version:
    name: Bump Version
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get current version
        id: current_version
        run: |
          # pkg/version.Version has no source-code literal to read (it is
          # "dev" unless overridden by -ldflags at build time — see the
          # Makefile and pkg/version/version.go). The version this workflow
          # tracks is the latest existing release tag instead.
          CURRENT_VERSION=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1 | sed 's/^v//')
          CURRENT_VERSION="${CURRENT_VERSION:-0.0.0}"
          echo "current=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT_VERSION"

      - name: Calculate new version
        id: new_version
        run: |
          CURRENT="${{ steps.current_version.outputs.current }}"
          TYPE="${{ github.event.inputs.version_type }}"

          IFS='.' read -r -a PARTS <<< "$CURRENT"
          MAJOR="${PARTS[0]}"
          MINOR="${PARTS[1]}"
          PATCH="${PARTS[2]}"

          case "$TYPE" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "new=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      - name: Create tag
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.new }}"
          git tag -a "v$NEW_VERSION" -m "Release v$NEW_VERSION"
          git push origin "v$NEW_VERSION"

  verify-version:
    name: Verify Version
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: go.sum

      - name: Extract version from tag
        id: tag_version
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Tag version: $TAG"

      - name: Build with the tag version and verify it was injected
        run: |
          TAG_VERSION="${{ steps.tag_version.outputs.tag }}"
          make build VERSION="$TAG_VERSION"
          OUTPUT=$(./build/zonekit --version)
          echo "$OUTPUT"

          case "$OUTPUT" in
            *"$TAG_VERSION"*)
              echo "✅ Built version matches tag: $TAG_VERSION" ;;
            *)
              echo "❌ Built version does not contain tag $TAG_VERSION"
              exit 1
              ;;
          esac

